# publishes every @pulgasari/* workspace member under js/packages to jsr.
# manual trigger keeps control over when a release goes out. jsr versions are
# immutable, so a run only succeeds for members whose version is not yet on jsr;
# bump the version in the member's deno.json before releasing again.
name: publish to jsr

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # oidc token jsr uses for auth + provenance
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: publish workspace
        working-directory: js/packages
        run: deno publish
